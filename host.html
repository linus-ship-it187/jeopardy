<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jeopardy – Host</title>

  <link rel="stylesheet" href="shared.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- Deine Dateien -->
  <script src="firebase-config.js"></script>
  <script src="game-data.js"></script>
  <script src="sync.js"></script>
  <script src="board.js"></script>
</head>

<body>

  <!-- ======================================================
       HEADER
  ======================================================= -->

  <header class="topbar">

    <h1>🎤 Jeopardy – Host</h1>

  </header>


  <!-- ======================================================
       KAMERAS
  ======================================================= -->

  <section class="camera-section">

    <div class="camera-header">

      <h2>🎥 Kameras</h2>

      <!-- SICHTBARER HOST-KAMERA-BUTTON -->
      <button
        id="hostCameraBtn"
        class="cam-toggle"
        type="button"
      >
        📷 Kamera einschalten
      </button>

    </div>


    <div
      id="camRow"
      class="cam-row"
    >

      <!-- ==================================================
           HOST-KAMERA
      =================================================== -->

      <div
        class="cam-tile"
        id="hostCamTile"
      >

        <div class="cam-video-wrap">

          <div
            id="hostCamPlaceholder"
            class="cam-placeholder"
          >
            🎤
            <br>
            <span>Host</span>
          </div>


          <video
            id="hostLocalVideo"
            autoplay
            muted
            playsinline
            style="display:none;"
          ></video>

        </div>


        <div class="cam-name">
          Host
        </div>

      </div>

    </div>

  </section>


  <!-- ======================================================
       SPIELER
  ======================================================= -->

  <section class="host-panel">

    <div class="host-panel-header">

      <h2>👥 Spieler</h2>

      <button
        id="addPlayerBtn"
        type="button"
      >
        ➕ Spieler hinzufügen
      </button>

    </div>


    <div id="playerRows"></div>

  </section>


  <!-- ======================================================
       SPIELBRETT
  ======================================================= -->

  <main>

    <div id="board"></div>

  </main>


  <!-- ======================================================
       FRAGE-MODAL
  ======================================================= -->

  <div
    id="questionModal"
    class="modal"
    style="display:none;"
  >

    <div class="modal-content">

      <button
        id="closeModal"
        class="modal-close"
        type="button"
      >
        ✕
      </button>


      <div id="modalCategory"></div>

      <div id="modalValue"></div>

      <div id="modalQuestion"></div>

      <div id="modalAnswer"></div>

    </div>

  </div>


  <!-- ======================================================
       JAVASCRIPT
  ======================================================= -->

  <script>

    // ======================================================
    // VARIABLEN
    // ======================================================

    let nextId = 1;

    let hostCameraStream = null;


    const hostCameraBtn =
      document.getElementById(
        "hostCameraBtn"
      );


    const hostLocalVideo =
      document.getElementById(
        "hostLocalVideo"
      );


    const hostCamPlaceholder =
      document.getElementById(
        "hostCamPlaceholder"
      );


    const playerRows =
      document.getElementById(
        "playerRows"
      );


    const addPlayerBtn =
      document.getElementById(
        "addPlayerBtn"
      );


    // ======================================================
    // HOST-KAMERA
    // ======================================================

    async function toggleHostCamera() {

      // ----------------------------------------------------
      // KAMERA AUSSCHALTEN
      // ----------------------------------------------------

      if (hostCameraStream) {

        console.log(
          "Host-Kamera wird ausgeschaltet."
        );


        if (
          typeof stopLocalCamera ===
          "function"
        ) {

          stopLocalCamera();

        }


        hostCameraStream
          .getTracks()
          .forEach(track => {

            track.stop();

          });


        hostCameraStream = null;


        hostLocalVideo.srcObject =
          null;


        hostLocalVideo.style.display =
          "none";


        hostCamPlaceholder.style.display =
          "flex";


        hostCameraBtn.textContent =
          "📷 Kamera einschalten";


        hostCameraBtn.classList.remove(
          "active"
        );


        return;

      }


      // ----------------------------------------------------
      // BROWSER PRÜFEN
      // ----------------------------------------------------

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        alert(
          "Dein Browser unterstützt keinen Kamerazugriff."
        );

        return;

      }


      // ----------------------------------------------------
      // HTTPS PRÜFEN
      // ----------------------------------------------------

      if (
        !window.isSecureContext &&
        location.hostname !== "localhost"
      ) {

        alert(
          "Der Kamerazugriff funktioniert nur über HTTPS " +
          "oder localhost."
        );

        return;

      }


      try {

        console.log(
          "Versuche Host-Kamera zu öffnen..."
        );


        hostCameraBtn.disabled =
          true;


        hostCameraBtn.textContent =
          "⏳ Kamera wird gestartet...";


        // --------------------------------------------------
        // KAMERA ÖFFNEN
        // --------------------------------------------------

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              },

              facingMode: "user"

            },

            audio: false

          });


        console.log(
          "Kamera erfolgreich geöffnet.",
          stream
        );


        hostCameraStream =
          stream;


        // --------------------------------------------------
        // LOKALES VIDEO
        // --------------------------------------------------

        hostLocalVideo.srcObject =
          stream;


        hostLocalVideo.style.display =
          "block";


        hostCamPlaceholder.style.display =
          "none";


        try {

          await hostLocalVideo.play();

        } catch (playError) {

          console.warn(
            "Video konnte nicht automatisch gestartet werden:",
            playError
          );

        }


        // --------------------------------------------------
        // AN WEBRTC ÜBERGEBEN
        // --------------------------------------------------

        if (
          typeof startLocalCamera ===
          "function"
        ) {

          await startLocalCamera(
            stream
          );

        } else {

          console.warn(
            "startLocalCamera() wurde nicht gefunden."
          );

        }


        // --------------------------------------------------
        // BUTTON
        // --------------------------------------------------

        hostCameraBtn.disabled =
          false;


        hostCameraBtn.textContent =
          "🛑 Kamera ausschalten";


        hostCameraBtn.classList.add(
          "active"
        );


      } catch (error) {

        console.error(
          "Kamera-Fehler:",
          error
        );


        hostCameraStream =
          null;


        hostLocalVideo.srcObject =
          null;


        hostLocalVideo.style.display =
          "none";


        hostCamPlaceholder.style.display =
          "flex";


        hostCameraBtn.disabled =
          false;


        hostCameraBtn.textContent =
          "📷 Kamera einschalten";


        // --------------------------------------------------
        // FEHLERMELDUNG
        // --------------------------------------------------

        let message =
          "Kamera konnte nicht gestartet werden.\n\n";


        if (
          error.name ===
          "NotReadableError"
        ) {

          message +=
            "Die Kamera konnte nicht gelesen werden.\n\n" +

            "Möglicherweise wird sie bereits von " +
            "einem anderen Programm oder Browser-Tab " +
            "verwendet.\n\n" +

            "Schließe zum Beispiel OBS, Discord, Teams, " +
            "Zoom oder andere Tabs mit Kamerazugriff.";

        }

        else if (
          error.name ===
          "NotAllowedError"
        ) {

          message +=
            "Der Browser hat den Kamerazugriff blockiert.\n\n" +

            "Bitte erlaube dieser GitHub-Pages-Seite " +
            "den Zugriff auf deine Kamera.";

        }

        else if (
          error.name ===
          "NotFoundError"
        ) {

          message +=
            "Es wurde keine Kamera gefunden.";

        }

        else if (
          error.name ===
          "NotFoundError"
        ) {

          message +=
            "Es wurde keine Kamera gefunden.";

        }

        else if (
          error.name ===
          "SecurityError"
        ) {

          message +=
            "Der Browser verhindert den Kamerazugriff " +
            "aus Sicherheitsgründen.";

        }

        else {

          message +=
            "Browser-Fehler:\n" +
            error.name +
            "\n\n" +
            error.message;

        }


        alert(message);

      }

    }


    // ======================================================
    // BUTTON
    // ======================================================

    hostCameraBtn.addEventListener(
      "click",
      toggleHostCamera
    );


    // ======================================================
    // SPIELER DARSTELLEN
    // ======================================================

    function renderHostRows() {

      playerRows.innerHTML = "";


      PLAYERS.forEach(player => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "host-player-row";


        // --------------------------------------------------
        // NAME
        // --------------------------------------------------

        const nameInput =
          document.createElement(
            "input"
          );


        nameInput.type =
          "text";


        nameInput.value =
          player.name || "";


        nameInput.placeholder =
          "Spielername";


        nameInput.addEventListener(
          "change",
          () => {

            player.name =
              nameInput.value.trim();


            if (!player.name) {

              player.name =
                `Spieler ${player.id}`;

            }


            savePlayers(
              PLAYERS
            );

          }
        );


        // --------------------------------------------------
        // PUNKTE
        // --------------------------------------------------

        const scoreInput =
          document.createElement(
            "input"
          );


        scoreInput.type =
          "number";


        scoreInput.value =
          Number(player.score) || 0;


        scoreInput.placeholder =
          "Punkte";


        scoreInput.addEventListener(
          "change",
          () => {

            player.score =
              Number(
                scoreInput.value
              ) || 0;


            savePlayers(
              PLAYERS
            );

          }
        );


        // --------------------------------------------------
        // LÖSCHEN
        // --------------------------------------------------

        const deleteBtn =
          document.createElement(
            "button"
          );


        deleteBtn.type =
          "button";


        deleteBtn.textContent =
          "🗑️ Löschen";


        deleteBtn.addEventListener(
          "click",
          () => {

            PLAYERS =
              PLAYERS.filter(
                p =>
                  String(p.id) !==
                  String(player.id)
              );


            savePlayers(
              PLAYERS
            );


            renderHostRows();

          }
        );


        row.appendChild(
          nameInput
        );


        row.appendChild(
          scoreInput
        );


        row.appendChild(
          deleteBtn
        );


        playerRows.appendChild(
          row
        );

      });

    }


    // ======================================================
    // SPIELER HINZUFÜGEN
    // ======================================================

    addPlayerBtn.addEventListener(
      "click",
      () => {

        const id =
          nextId++;


        const newPlayer = {

          id: id,

          name:
            `Spieler ${id}`,

          score: 0

        };


        PLAYERS.push(
          newPlayer
        );


        savePlayers(
          PLAYERS
        );


        renderHostRows();

      }
    );


    // ======================================================
    // HTML ESCAPEN
    // ======================================================

    function escapeHtml(text) {

      return String(text)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    // ======================================================
    // KAMERA-ZEILE
    // ======================================================

    function renderCamRow() {

      const camRow =
        document.getElementById(
          "camRow"
        );


      const hostTile =
        document.getElementById(
          "hostCamTile"
        );


      // Alles außer Host entfernen
      camRow.innerHTML = "";


      // Host wieder einsetzen
      camRow.appendChild(
        hostTile
      );


      // ----------------------------------------------------
      // SPIELER-KAMERAS
      // ----------------------------------------------------

      PLAYERS.forEach(player => {

        const tile =
          document.createElement(
            "div"
          );


        tile.className =
          "cam-tile";


        tile.id =
          `cam-player-${player.id}`;


        const wrap =
          document.createElement(
            "div"
          );


        wrap.className =
          "cam-video-wrap";


        const placeholder =
          document.createElement(
            "div"
          );


        placeholder.className =
          "cam-placeholder";


        placeholder.innerHTML =
          `👤<br><span>${escapeHtml(
            player.name
          )}</span>`;


        const video =
          document.createElement(
            "video"
          );


        video.autoplay =
          true;


        video.playsInline =
          true;


        video.muted =
          true;


        video.style.display =
          "none";


        wrap.appendChild(
          placeholder
        );


        wrap.appendChild(
          video
        );


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "cam-name";


        name.textContent =
          player.name;


        tile.appendChild(
          wrap
        );


        tile.appendChild(
          name
        );


        camRow.appendChild(
          tile
        );


        // --------------------------------------------------
        // BEREITS VORHANDENEN REMOTE-STREAM ANZEIGEN
        // --------------------------------------------------

        if (
          typeof getRemoteCameraStream ===
          "function"
        ) {

          const stream =
            getRemoteCameraStream(
              String(player.id)
            );


          if (stream) {

            video.srcObject =
              stream;


            video.style.display =
              "block";


            placeholder.style.display =
              "none";


            video.play().catch(
              () => {}
            );

          }

        }

      });

    }


    // ======================================================
    // INIT
    // ======================================================

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        console.log(
          "Host-Seite wird initialisiert..."
        );


        // --------------------------------------------------
        // SPIELBRETT
        // --------------------------------------------------

        if (
          typeof renderBoard ===
          "function"
        ) {

          renderBoard(
            true
          );

        }


        // --------------------------------------------------
        // SPIELER INITIALISIEREN
        // --------------------------------------------------

        if (
          typeof seedPlayersIfEmpty ===
          "function"
        ) {

          await seedPlayersIfEmpty();

        }


        // --------------------------------------------------
        // SPIELER SYNCHRONISIEREN
        // --------------------------------------------------

        if (
          typeof watchPlayers ===
          "function"
        ) {

          watchPlayers(
            players => {

              PLAYERS =
                Array.isArray(players)
                  ? players
                  : Object.values(
                      players || {}
                    );


              nextId =
                Math.max(
                  0,

                  ...PLAYERS.map(
                    p =>
                      Number(p.id) || 0
                  )

                ) + 1;


              renderCamRow();

              renderHostRows();

            }
          );

        }


        // --------------------------------------------------
        // BENUTZTE FELDER
        // --------------------------------------------------

        if (
          typeof watchUsedCells ===
          "function"
        ) {

          watchUsedCells(
            applyUsedCells
          );

        }


        // --------------------------------------------------
        // WEBRTC
        // --------------------------------------------------

        if (
          typeof initCameraSync ===
          "function"
        ) {

          console.log(
            "Starte WebRTC-Synchronisation..."
          );


          initCameraSync({

            role:
              "host",


            playerId:
              null,


            onRemoteStream:
              (
                peerInfo,
                stream
              ) => {

                console.log(
                  "Remote-Kamera vom Peer:",
                  peerInfo
                );


                if (
                  !peerInfo ||
                  peerInfo.role !==
                    "player"
                ) {

                  return;

                }


                const playerId =
                  String(
                    peerInfo.playerId
                  );


                const tile =
                  document.getElementById(
                    `cam-player-${playerId}`
                  );


                if (!tile) {

                  return;

                }


                const video =
                  tile.querySelector(
                    "video"
                  );


                const placeholder =
                  tile.querySelector(
                    ".cam-placeholder"
                  );


                if (!video) {

                  return;

                }


                video.srcObject =
                  stream;


                video.style.display =
                  "block";


                if (placeholder) {

                  placeholder.style.display =
                    "none";

                }


                video.play().catch(
                  () => {}
                );

              }

          });

        }

        else {

          console.error(
            "FEHLER: initCameraSync() ist nicht definiert."
          );

        }


        console.log(
          "Host-Seite vollständig geladen."
        );

      }
    );

  </script>

</body>
</html>
