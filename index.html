<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streamer Jeopardy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         TITEL
         ===================================== -->

    <h1>JEOPARDY</h1>


    <!-- =====================================
         JEOPARDY SPIELFELD
         ===================================== -->

    <div class="game-board">

        <!-- KATEGORIE 1 -->
        <div class="category">

            <div class="category-title">
                Allgemeinwissen
            </div>

            <button class="points">100</button>
            <button class="points">200</button>
            <button class="points">300</button>
            <button class="points">400</button>
            <button class="points">500</button>

        </div>


        <!-- KATEGORIE 2 -->
        <div class="category">

            <div class="category-title">
                Gaming
            </div>

            <button class="points">100</button>
            <button class="points">200</button>
            <button class="points">300</button>
            <button class="points">400</button>
            <button class="points">500</button>

        </div>


        <!-- KATEGORIE 3 -->
        <div class="category">

            <div class="category-title">
                Musik
            </div>

            <button class="points">100</button>
            <button class="points">200</button>
            <button class="points">300</button>
            <button class="points">400</button>
            <button class="points">500</button>

        </div>


        <!-- KATEGORIE 4 -->
        <div class="category">

            <div class="category-title">
                Filme & Serien
            </div>

            <button class="points">100</button>
            <button class="points">200</button>
            <button class="points">300</button>
            <button class="points">400</button>
            <button class="points">500</button>

        </div>


        <!-- KATEGORIE 5 -->
        <div class="category">

            <div class="category-title">
                Random
            </div>

            <button class="points">100</button>
            <button class="points">200</button>
            <button class="points">300</button>
            <button class="points">400</button>
            <button class="points">500</button>

        </div>

    </div>


    <!-- =====================================
         5 STREAMER
         ===================================== -->

    <div class="players">


        <!-- STREAMER 1 -->
        <div class="player">

            <div class="player-camera">
                CAM 1
            </div>

            <div class="player-info">
                <span>Niek-0</span>
                <span class="player-score">0</span>
            </div>

        </div>


        <!-- STREAMER 2 -->
        <div class="player">

            <div class="player-camera">
                CAM 2
            </div>

            <div class="player-info">
                <span>Basti-100</span>
                <span class="player-score">0</span>
            </div>

        </div>


        <!-- STREAMER 3 -->
        <div class="player">

            <div class="player-camera">
                CAM 3
            </div>

            <div class="player-info">
                <span>Kevin-200</span>
                <span class="player-score">0</span>
            </div>

        </div>


        <!-- STREAMER 4 -->
        <div class="player">

            <div class="player-camera">
                CAM 4
            </div>

            <div class="player-info">
                <span>Lara-300</span>
                <span class="player-score">0</span>
            </div>

        </div>


        <!-- STREAMER 5 -->
        <div class="player">

            <div class="player-camera">
                CAM 5
            </div>

            <div class="player-info">
                <span>Tobias-400</span>
                <span class="player-score">0</span>
            </div>

        </div>

    </div>

</body>
</html>
