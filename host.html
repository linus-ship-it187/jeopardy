<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jeopardy — Host</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="shared.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

</head>

<body>

  <!-- ======================================================
       HEADER
  ======================================================= -->

  <div class="header">

    <svg viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M12 0l2.2 7.2L21 9.4l-6 4.4 2.2 7.2L12 17l-5.2 4-2.2-7.2-6-4.4 6.8-2.2z"
        transform="translate(1.4)"
      />
    </svg>

    <h1>Jeopardy</h1>

    <svg viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M12 0l2.2 7.2L21 9.4l-6 4.4 2.2 7.2L12 17l-5.2 4-2.2-7.2-6-4.4 6.8-2.2z"
        transform="translate(1.4)"
      />
    </svg>

  </div>


  <p class="mode-tag">
    HOST-ANSICHT — diesen Link nicht an die anderen Streamer weitergeben
  </p>


  <!-- ======================================================
       SPIELFELD
  ======================================================= -->

  <div class="board">
    <div class="grid" id="board-grid"></div>
  </div>


  <!-- ======================================================
       KAMERAS
  ======================================================= -->

  <div class="camrow" id="camrow"></div>


  <!-- ======================================================
       HOST STEUERUNG
  ======================================================= -->

  <details class="host-panel" open>

    <summary>
      🔒 Host-Steuerung – nur für dich
    </summary>

    <div class="host-rows" id="host-rows"></div>

    <button
      class="add-team"
      id="add-team"
    >
      + Person hinzufügen
    </button>

  </details>


  <!-- ======================================================
       FRAGEN MODAL
  ======================================================= -->

  <div
    class="overlay"
    id="overlay"
    hidden
  >

    <div class="modal">

      <div
        class="eyebrow"
        id="modal-meta"
      ></div>

      <p
        class="prompt"
        id="modal-question"
      ></p>

      <p
        class="answer"
        id="modal-answer"
        hidden
      ></p>

      <div class="modal-actions">

        <button
          class="btn-primary"
          id="reveal-btn"
        >
          Antwort zeigen
        </button>

        <button
          class="btn-ghost"
          id="close-btn"
        >
          Schließen
        </button>

      </div>

    </div>

  </div>


<script src="firebase-config.js"></script>
<script src="game-data.js"></script>
<script src="sync.js"></script>
<script src="board.js"></script>


<script>

  // ========================================================
  // HOST
  // ========================================================

  let nextId = PLAYERS.length + 1;

  const camrow =
    document.getElementById('camrow');

  const hostRows =
    document.getElementById('host-rows');


  // Hier werden empfangene Kamerastreams gespeichert.
  const remoteStreams = {};


  // ========================================================
  // KAMERAS RENDERN
  // ========================================================

  function renderCamRow() {

    camrow.innerHTML = '';

    PLAYERS.forEach(player => {

      const tile =
        document.createElement('div');

      tile.className = 'cam-tile';


      const videoWrap =
        document.createElement('div');

      videoWrap.className =
        'cam-video-wrap';


      const placeholder =
        document.createElement('div');

      placeholder.className =
        'cam-placeholder';

      placeholder.textContent =
        player.name
          .charAt(0)
          .toUpperCase();


      const video =
        document.createElement('video');

      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;

      video.style.display = 'none';


      // Kamera dieses Spielers vorhanden?
      if (remoteStreams[player.id]) {

        video.srcObject =
          remoteStreams[player.id];

        video.style.display =
          'block';

        placeholder.style.display =
          'none';
      }


      videoWrap.appendChild(
        placeholder
      );

      videoWrap.appendChild(
        video
      );


      const footer =
        document.createElement('div');

      footer.className =
        'cam-footer';


      const nameEl =
        document.createElement('span');

      nameEl.className =
        'cam-name';

      nameEl.textContent =
        player.name;


      const scoreEl =
        document.createElement('span');

      scoreEl.className =
        'cam-score';

      scoreEl.textContent =
        player.score;


      footer.appendChild(
        nameEl
      );

      footer.appendChild(
        scoreEl
      );


      tile.appendChild(
        videoWrap
      );

      tile.appendChild(
        footer
      );


      camrow.appendChild(
        tile
      );

    });
  }


  // ========================================================
  // HOST SPIELER-STEUERUNG
  // ========================================================

  function renderHostRows() {

    hostRows.innerHTML = '';

    PLAYERS.forEach(player => {

      const row =
        document.createElement('div');

      row.className =
        'host-row';


      // Name
      const nameInput =
        document.createElement('input');

      nameInput.type =
        'text';

      nameInput.value =
        player.name;

      nameInput.addEventListener(
        'change',
        event => {

          player.name =
            event.target.value;

          savePlayers(PLAYERS);
        }
      );


      // Minus
      const minus =
        document.createElement('button');

      minus.className =
        'score-btn';

      minus.textContent =
        '−';

      minus.addEventListener(
        'click',
        () => {

          player.score -= 100;

          savePlayers(PLAYERS);
        }
      );


      // Punkte
      const score =
        document.createElement('span');

      score.className =
        'host-score-value';

      score.textContent =
        player.score;


      // Plus
      const plus =
        document.createElement('button');

      plus.className =
        'score-btn';

      plus.textContent =
        '+';

      plus.addEventListener(
        'click',
        () => {

          player.score += 100;

          savePlayers(PLAYERS);
        }
      );


      // Entfernen
      const remove =
        document.createElement('button');

      remove.className =
        'remove-btn';

      remove.textContent =
        'Entfernen';

      remove.addEventListener(
        'click',
        () => {

          PLAYERS =
            PLAYERS.filter(
              p => p.id !== player.id
            );

          savePlayers(PLAYERS);
        }
      );


      row.appendChild(
        nameInput
      );

      row.appendChild(
        minus
      );

      row.appendChild(
        score
      );

      row.appendChild(
        plus
      );

      row.appendChild(
        remove
      );

      hostRows.appendChild(
        row
      );

    });
  }


  // ========================================================
  // SPIELER HINZUFÜGEN
  // ========================================================

  document
    .getElementById('add-team')
    .addEventListener(
      'click',
      () => {

        PLAYERS.push({
          id: nextId++,
          name:
            `Spieler ${PLAYERS.length + 1}`,
          score: 0
        });

        savePlayers(PLAYERS);
      }
    );


  // ========================================================
  // BOARD
  // ========================================================

  renderBoard(true);

  seedPlayersIfEmpty();


  // ========================================================
  // SPIELER LIVE SYNCHRONISIEREN
  // ========================================================

  watchPlayers(players => {

    PLAYERS =
      Array.isArray(players)
        ? players
        : Object.values(players);


    nextId =
      Math.max(
        0,
        ...PLAYERS.map(
          p => Number(p.id) || 0
        )
      ) + 1;


    renderCamRow();
    renderHostRows();

  });


  // ========================================================
  // BENUTZTE FRAGEN
  // ========================================================

  watchUsedCells(
    applyUsedCells
  );


  // ========================================================
  // WEBRTC / KAMERA
  // ========================================================

  initCameraSync({

    role: 'host',

    onRemoteStream:
      (playerId, stream) => {

        if (playerId == null) {
          return;
        }

        remoteStreams[playerId] =
          stream;

        renderCamRow();
      }

  });

</script>

</body>
</html>
