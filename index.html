<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeopardy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0l2.2 7.2L21 9.4l-6 4.4 2.2 7.2L12 17l-5.2 4-2.2-7.2-6-4.4 6.8-2.2z" transform="translate(1.4)" />
    </svg>
    <h1>Jeopardy</h1>
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0l2.2 7.2L21 9.4l-6 4.4 2.2 7.2L12 17l-5.2 4-2.2-7.2-6-4.4 6.8-2.2z" transform="translate(1.4)" />
    </svg>
  </div>

  <!-- SPIELER AUSWÄHLEN -->
  <div id="player-select-box" style="max-width:1080px; margin:0 auto 20px; text-align:center; padding:15px;">
    <label for="player-select" style="font-weight:800; margin-right:10px;">Du bist:</label>
    <select id="player-select" style="padding:10px 15px; border-radius:10px; font-size:16px;">
      <option value="">Spieler auswählen</option>
    </select>
  </div>

  <!-- SPIELFELD -->
  <div class="board">
    <div class="grid" id="board-grid"></div>
  </div>

  <!-- KAMERAS -->
  <div class="camrow" id="camrow"></div>

  <!-- MODAL -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal">
      <div class="eyebrow" id="modal-meta"></div>
      <p class="prompt" id="modal-question"></p>
      <p class="answer" id="modal-answer" hidden></p>
      <div class="modal-actions">
        <button class="btn-primary" id="reveal-btn">Antwort zeigen</button>
        <button class="btn-ghost" id="close-btn">Schließen</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT MODUL -->
  <script type="module">
    import { 
      watchPlayers, 
      watchUsedCells, 
      watchActiveQuestion, 
      initCameraSync, 
      startLocalCamera, 
      stopLocalCamera 
    } from './sync.js';
    import { renderBoard, applyUsedCells, openModal } from './board.js';

    const camrow = document.getElementById('camrow');
    const playerSelect = document.getElementById('player-select');
    const playerSelectBox = document.getElementById('player-select-box');

    let PLAYERS = [];
    let localPlayerId = null;
    const remoteStreams = {};

    const urlParams = new URLSearchParams(window.location.search);
    const urlPlayerId = urlParams.get('player');
    if (urlPlayerId !== null) {
      localPlayerId = Number(urlPlayerId);
    }

    function renderPlayerSelect() {
      playerSelect.innerHTML = '<option value="">Spieler auswählen</option>';
      PLAYERS.forEach(player => {
        const option = document.createElement('option');
        option.value = player.id;
        option.textContent = player.name;
        if (Number(player.id) === Number(localPlayerId)) {
          option.selected = true;
        }
        playerSelect.appendChild(option);
      });

      playerSelectBox.style.display = localPlayerId !== null ? 'none' : 'block';
    }

    playerSelect.addEventListener('change', () => {
      if (!playerSelect.value) return;
      localPlayerId = Number(playerSelect.value);
      window.location.href = window.location.pathname + '?player=' + encodeURIComponent(localPlayerId);
    });

    function renderCamRow() {
      camrow.innerHTML = '';
      PLAYERS.forEach(player => {
        const tile = document.createElement('div');
        tile.className = 'cam-tile';

        const videoWrap = document.createElement('div');
        videoWrap.className = 'cam-video-wrap';

        const placeholder = document.createElement('div');
        placeholder.className = 'cam-placeholder';
        placeholder.textContent = (player.name || '?').charAt(0).toUpperCase();

        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        video.muted = true;
        video.style.display = 'none';

        if (remoteStreams[player.id]) {
          video.srcObject = remoteStreams[player.id];
          video.style.display = 'block';
          placeholder.style.display = 'none';
        }

        const isMe = Number(player.id) === Number(localPlayerId);

        if (isMe) {
          const camBtn = document.createElement('button');
          camBtn.className = 'cam-toggle';
          camBtn.textContent = 'Kamera an';

          camBtn.addEventListener('click', async () => {
            if (video.srcObject) {
              stopLocalCamera();
              video.srcObject = null;
              video.style.display = 'none';
              placeholder.style.display = 'flex';
              camBtn.textContent = 'Kamera an';
              return;
            }

            try {
              const stream = await startLocalCamera();
              video.srcObject = stream;
              video.style.display = 'block';
              placeholder.style.display = 'none';
              camBtn.textContent = 'Kamera aus';
            } catch (err) {
              alert('Kamera konnte nicht gestartet werden: ' + err.message);
            }
          });

          videoWrap.appendChild(camBtn);
        } else if (remoteStreams[player.id]) {
          const status = document.createElement('div');
          status.style.position = 'absolute';
          status.style.bottom = '8px';
          status.style.left = '8px';
          status.style.background = 'rgba(0,0,0,.7)';
          status.style.color = 'white';
          status.style.padding = '4px 8px';
          status.style.borderRadius = '6px';
          status.style.fontSize = '12px';
          status.textContent = 'LIVE';
          videoWrap.appendChild(status);
        }

        videoWrap.insertBefore(placeholder, videoWrap.firstChild);
        videoWrap.insertBefore(video, videoWrap.children[1]);

        const footer = document.createElement('div');
        footer.className = 'cam-footer';

        const nameEl = document.createElement('span');
        nameEl.className = 'cam-name';
        nameEl.textContent = player.name;

        const scoreEl = document.createElement('span');
        scoreEl.className = 'cam-score';
        scoreEl.textContent = player.score;

        footer.appendChild(nameEl);
        footer.appendChild(scoreEl);

        tile.appendChild(videoWrap);
        tile.appendChild(footer);
        camrow.appendChild(tile);
      });
    }

    renderBoard(false);

    watchPlayers(players => {
      PLAYERS = !players ? [] : (Array.isArray(players) ? players : Object.values(players));
      renderPlayerSelect();
      renderCamRow();
    });

    watchUsedCells(applyUsedCells);

    watchActiveQuestion(qData => {
      const overlay = document.getElementById('overlay');
      if (qData) {
        openModal(qData);
      } else if (overlay) {
        overlay.hidden = true;
      }
    });

    initCameraSync({
      role: 'player',
      playerId: localPlayerId,
      onRemoteStream: (playerId, stream) => {
        if (playerId == null || Number(playerId) === Number(localPlayerId)) return;
        remoteStreams[playerId] = stream;
        renderCamRow();
      }
    });
  </script>
</body>
</html>
