<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jeopardy – Host</title>

  <link rel="stylesheet" href="shared.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- Deine Dateien -->
  <script src="firebase-config.js"></script>
  <script src="game-data.js"></script>
  <script src="sync.js"></script>
  <script src="board.js"></script>
</head>

<body>

  <!-- ======================================================
       HEADER
  ======================================================= -->

  <header class="topbar">

    <h1>🎤 Jeopardy – Host</h1>

  </header>


  <!-- ======================================================
       KAMERAS
  ======================================================= -->

  <section class="camera-section">

    <div
      class="camera-header"
      style="
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:20px;
        flex-wrap:wrap;
      "
    >

      <h2>🎥 Kameras</h2>


      <!-- ==================================================
           HOST KAMERA BUTTON
      =================================================== -->

      <button
        id="hostCameraBtn"
        type="button"
        style="
          display:inline-block !important;
          visibility:visible !important;
          opacity:1 !important;
          position:relative !important;
          z-index:99999 !important;

          padding:14px 24px !important;
          margin:10px !important;

          background:#3155d9 !important;
          color:#ffffff !important;

          border:2px solid #ffffff !important;
          border-radius:10px !important;

          font-size:18px !important;
          font-weight:bold !important;

          cursor:pointer !important;
        "
      >
        📷 Kamera einschalten
      </button>

    </div>


    <!-- ====================================================
         KAMERA-REIHE
    ===================================================== -->

    <div
      id="camRow"
      class="cam-row"
    >

      <!-- ==================================================
           HOST-KAMERA
      =================================================== -->

      <div
        class="cam-tile"
        id="hostCamTile"
      >

        <div class="cam-video-wrap">

          <!-- Platzhalter -->
          <div
            id="hostCamPlaceholder"
            class="cam-placeholder"
          >
            🎤
            <br>
            <span>Host</span>
          </div>


          <!-- Lokales Host-Video -->
          <video
            id="hostLocalVideo"
            autoplay
            muted
            playsinline
            style="
              display:none;
              width:100%;
              height:100%;
              object-fit:cover;
            "
          ></video>

        </div>


        <div class="cam-name">
          Host
        </div>

      </div>

    </div>

  </section>


  <!-- ======================================================
       SPIELER
  ======================================================= -->

  <section class="host-panel">

    <div class="host-panel-header">

      <h2>👥 Spieler</h2>


      <button
        id="addPlayerBtn"
        type="button"
      >
        ➕ Spieler hinzufügen
      </button>

    </div>


    <div id="playerRows"></div>

  </section>


  <!-- ======================================================
       SPIELBRETT
  ======================================================= -->

  <main>

    <div id="board"></div>

  </main>


  <!-- ======================================================
       FRAGE-MODAL
  ======================================================= -->

  <div
    id="questionModal"
    class="modal"
    style="display:none;"
  >

    <div class="modal-content">

      <button
        id="closeModal"
        class="modal-close"
        type="button"
      >
        ✕
      </button>


      <div id="modalCategory"></div>

      <div id="modalValue"></div>

      <div id="modalQuestion"></div>

      <div id="modalAnswer"></div>

    </div>

  </div>


  <!-- ======================================================
       JAVASCRIPT
  ======================================================= -->

  <script>

    // ======================================================
    // VARIABLEN
    // ======================================================

    let nextId = 1;

    let hostCameraStream = null;


    const hostCameraBtn =
      document.getElementById(
        "hostCameraBtn"
      );


    const hostLocalVideo =
      document.getElementById(
        "hostLocalVideo"
      );


    const hostCamPlaceholder =
      document.getElementById(
        "hostCamPlaceholder"
      );


    const playerRows =
      document.getElementById(
        "playerRows"
      );


    const addPlayerBtn =
      document.getElementById(
        "addPlayerBtn"
      );


    // ======================================================
    // HOST-KAMERA EIN/AUS
    // ======================================================

    async function toggleHostCamera() {

      console.log(
        "Host-Kamera Button gedrückt."
      );


      // ====================================================
      // KAMERA AUSSCHALTEN
      // ====================================================

      if (hostCameraStream) {

        console.log(
          "Host-Kamera wird ausgeschaltet."
        );


        hostCameraStream
          .getTracks()
          .forEach(track => {

            track.stop();

          });


        hostCameraStream = null;


        hostLocalVideo.srcObject =
          null;


        hostLocalVideo.style.display =
          "none";


        hostCamPlaceholder.style.display =
          "flex";


        hostCameraBtn.textContent =
          "📷 Kamera einschalten";


        hostCameraBtn.style.background =
          "#3155d9";


        return;

      }


      // ====================================================
      // BROWSER KAMERA PRÜFEN
      // ====================================================

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        alert(
          "Dein Browser unterstützt keinen Kamerazugriff.\n\n" +
          "Bitte verwende einen aktuellen Chrome-, Edge- oder Firefox-Browser."
        );

        return;

      }


      // ====================================================
      // HTTPS PRÜFEN
      // ====================================================

      if (
        !window.isSecureContext &&
        location.hostname !== "localhost"
      ) {

        alert(
          "Die Kamera funktioniert nur über HTTPS oder localhost.\n\n" +
          "Öffne die Seite über deine GitHub-Pages-Adresse."
        );

        return;

      }


      // ====================================================
      // KAMERA STARTEN
      // ====================================================

      try {

        console.log(
          "Fordere Kamerazugriff an..."
        );


        hostCameraBtn.disabled =
          true;


        hostCameraBtn.textContent =
          "⏳ Kamera wird gestartet...";


        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              },

              facingMode: "user"

            },

            audio: false

          });


        console.log(
          "Kamera erfolgreich geöffnet!",
          stream
        );


        hostCameraStream =
          stream;


        // ==================================================
        // VIDEO ANZEIGEN
        // ==================================================

        hostLocalVideo.srcObject =
          stream;


        hostLocalVideo.style.display =
          "block";


        hostCamPlaceholder.style.display =
          "none";


        try {

          await hostLocalVideo.play();

        } catch (error) {

          console.warn(
            "Video play() Fehler:",
            error
          );

        }


        // ==================================================
        // BUTTON AKTUALISIEREN
        // ==================================================

        hostCameraBtn.disabled =
          false;


        hostCameraBtn.textContent =
          "🛑 Kamera ausschalten";


        hostCameraBtn.style.background =
          "#c62828";


        console.log(
          "HOST-KAMERA LÄUFT."
        );


        /*
         * WICHTIG:
         *
         * Hier wird absichtlich NICHT
         * startLocalCamera() aufgerufen.
         *
         * Damit testen wir zunächst ausschließlich,
         * ob die Host-Kamera lokal funktioniert.
         */

      } catch (error) {

        console.error(
          "HOST KAMERA FEHLER:",
          error
        );


        hostCameraStream =
          null;


        hostLocalVideo.srcObject =
          null;


        hostLocalVideo.style.display =
          "none";


        hostCamPlaceholder.style.display =
          "flex";


        hostCameraBtn.disabled =
          false;


        hostCameraBtn.textContent =
          "📷 Kamera einschalten";


        hostCameraBtn.style.background =
          "#3155d9";


        // ==================================================
        // FEHLER AUSWERTEN
        // ==================================================

        let message =
          "Die Host-Kamera konnte nicht gestartet werden.\n\n";


        if (
          error.name ===
          "NotReadableError"
        ) {

          message +=
            "Die Kamera ist vorhanden, kann aber nicht gelesen werden.\n\n" +

            "Möglicherweise wird sie bereits benutzt von:\n" +
            "• OBS\n" +
            "• Discord\n" +
            "• Teams\n" +
            "• Zoom\n" +
            "• einem anderen Browser-Tab\n\n" +

            "Schließe diese Programme/Tabs und versuche es erneut.";

        }

        else if (
          error.name ===
          "NotAllowedError"
        ) {

          message +=
            "Der Browser hat den Kamerazugriff blockiert.\n\n" +

            "Klicke in der Browser-Adressleiste auf das Kamera-Symbol " +
            "und erlaube den Kamerazugriff.";

        }

        else if (
          error.name ===
          "NotFoundError"
        ) {

          message +=
            "Es wurde keine Kamera gefunden.";

        }

        else if (
          error.name ===
          "SecurityError"
        ) {

          message +=
            "Der Browser blockiert den Kamerazugriff aus Sicherheitsgründen.\n\n" +

            "Verwende HTTPS.";

        }

        else {

          message +=
            "Fehler: " +
            error.name +
            "\n\n" +
            error.message;

        }


        alert(message);

      }

    }


    // ======================================================
    // BUTTON EVENT
    // ======================================================

    hostCameraBtn.addEventListener(
      "click",
      toggleHostCamera
    );


    // ======================================================
    // SPIELER DARSTELLEN
    // ======================================================

    function renderHostRows() {

      playerRows.innerHTML = "";


      PLAYERS.forEach(player => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "host-player-row";


        // --------------------------------------------------
        // NAME
        // --------------------------------------------------

        const nameInput =
          document.createElement(
            "input"
          );


        nameInput.type =
          "text";


        nameInput.value =
          player.name || "";


        nameInput.placeholder =
          "Spielername";


        nameInput.addEventListener(
          "change",
          () => {

            player.name =
              nameInput.value.trim();


            if (!player.name) {

              player.name =
                `Spieler ${player.id}`;

            }


            savePlayers(
              PLAYERS
            );

          }
        );


        // --------------------------------------------------
        // PUNKTE
        // --------------------------------------------------

        const scoreInput =
          document.createElement(
            "input"
          );


        scoreInput.type =
          "number";


        scoreInput.value =
          Number(player.score) || 0;


        scoreInput.placeholder =
          "Punkte";


        scoreInput.addEventListener(
          "change",
          () => {

            player.score =
              Number(
                scoreInput.value
              ) || 0;


            savePlayers(
              PLAYERS
            );

          }
        );


        // --------------------------------------------------
        // LÖSCHEN
        // --------------------------------------------------

        const deleteBtn =
          document.createElement(
            "button"
          );


        deleteBtn.type =
          "button";


        deleteBtn.textContent =
          "🗑️ Löschen";


        deleteBtn.addEventListener(
          "click",
          () => {

            PLAYERS =
              PLAYERS.filter(
                p =>
                  String(p.id) !==
                  String(player.id)
              );


            savePlayers(
              PLAYERS
            );


            renderHostRows();

            renderCamRow();

          }
        );


        row.appendChild(
          nameInput
        );


        row.appendChild(
          scoreInput
        );


        row.appendChild(
          deleteBtn
        );


        playerRows.appendChild(
          row
        );

      });

    }


    // ======================================================
    // SPIELER HINZUFÜGEN
    // ======================================================

    addPlayerBtn.addEventListener(
      "click",
      () => {

        const id =
          nextId++;


        const newPlayer = {

          id: id,

          name:
            `Spieler ${id}`,

          score: 0

        };


        PLAYERS.push(
          newPlayer
        );


        savePlayers(
          PLAYERS
        );


        renderHostRows();

        renderCamRow();

      }
    );


    // ======================================================
    // HTML ESCAPEN
    // ======================================================

    function escapeHtml(text) {

      return String(text)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    // ======================================================
    // KAMERA-ZEILE
    // ======================================================

    function renderCamRow() {

      const camRow =
        document.getElementById(
          "camRow"
        );


      const hostTile =
        document.getElementById(
          "hostCamTile"
        );


      /*
       * Spieler-Kacheln entfernen.
       * Host-Kachel behalten.
       */

      camRow.innerHTML = "";


      camRow.appendChild(
        hostTile
      );


      // ----------------------------------------------------
      // SPIELER-KAMERAS
      // ----------------------------------------------------

      PLAYERS.forEach(player => {

        const tile =
          document.createElement(
            "div"
          );


        tile.className =
          "cam-tile";


        tile.id =
          `cam-player-${player.id}`;


        const wrap =
          document.createElement(
            "div"
          );


        wrap.className =
          "cam-video-wrap";


        const placeholder =
          document.createElement(
            "div"
          );


        placeholder.className =
          "cam-placeholder";


        placeholder.innerHTML =
          `👤<br><span>${escapeHtml(
            player.name
          )}</span>`;


        const video =
          document.createElement(
            "video"
          );


        video.autoplay =
          true;


        video.playsInline =
          true;


        video.muted =
          true;


        video.style.display =
          "none";


        wrap.appendChild(
          placeholder
        );


        wrap.appendChild(
          video
        );


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "cam-name";


        name.textContent =
          player.name;


        tile.appendChild(
          wrap
        );


        tile.appendChild(
          name
        );


        camRow.appendChild(
          tile
        );


        /*
         * Falls sync.js bereits einen Remote-Stream
         * bereitstellt.
         */

        if (
          typeof getRemoteCameraStream ===
          "function"
        ) {

          const stream =
            getRemoteCameraStream(
              String(player.id)
            );


          if (stream) {

            video.srcObject =
              stream;


            video.style.display =
              "block";


            placeholder.style.display =
              "none";


            video.play().catch(
              () => {}
            );

          }

        }

      });

    }


    // ======================================================
    // SEITE INITIALISIEREN
    // ======================================================

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        console.log(
          "================================="
        );

        console.log(
          "JEOPARDY HOST START"
        );

        console.log(
          "================================="
        );


        // --------------------------------------------------
        // SPIELBRETT
        // --------------------------------------------------

        if (
          typeof renderBoard ===
          "function"
        ) {

          renderBoard(
            true
          );

        }


        // --------------------------------------------------
        // SPIELER INITIALISIEREN
        // --------------------------------------------------

        if (
          typeof seedPlayersIfEmpty ===
          "function"
        ) {

          await seedPlayersIfEmpty();

        }


        // --------------------------------------------------
        // SPIELER ÜBERWACHEN
        // --------------------------------------------------

        if (
          typeof watchPlayers ===
          "function"
        ) {

          watchPlayers(
            players => {

              PLAYERS =
                Array.isArray(players)
                  ? players
                  : Object.values(
                      players || {}
                    );


              nextId =
                Math.max(
                  0,

                  ...PLAYERS.map(
                    p =>
                      Number(p.id) || 0
                  )

                ) + 1;


              renderHostRows();

              renderCamRow();

            }
          );

        }


        // --------------------------------------------------
        // BENUTZTE FELDER
        // --------------------------------------------------

        if (
          typeof watchUsedCells ===
          "function"
        ) {

          watchUsedCells(
            applyUsedCells
          );

        }


        // --------------------------------------------------
        // WEBRTC VORERST NICHT BENÖTIGT
        // --------------------------------------------------

        console.log(
          "Host-Kamera kann lokal gestartet werden."
        );


        console.log(
          "================================="
        );

      }
    );

  </script>

</body>
</html>
