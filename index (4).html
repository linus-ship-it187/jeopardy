<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

  <div class="header">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.2 7.2L21 9.4l-6 4.4 2.2 7.2L12 17l-5.2 4-2.2-7.2L-1.4 9.4l6.8-2.2z" transform="translate(1.4)"/></svg>
    <h1>Jeopardy</h1>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.2 7.2L21 9.4l-6 4.4 2.2 7.2L12 17l-5.2 4-2.2-7.2L-1.4 9.4l6.8-2.2z" transform="translate(1.4)"/></svg>
  </div>

  <div class="board">
    <div class="grid" id="board-grid"></div>
  </div>

  <div class="camrow" id="camrow"></div>

  <!-- Overlay/Modal existiert nur, damit board.js auf beiden Seiten funktioniert.
       Auf dieser Seite wird es nie geöffnet, da die Zellen nicht klickbar sind. -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal">
      <div class="eyebrow" id="modal-meta"></div>
      <p class="prompt" id="modal-question"></p>
      <p class="answer" id="modal-answer" hidden></p>
      <div class="modal-actions">
        <button class="btn-primary" id="reveal-btn">Antwort zeigen</button>
        <button class="btn-ghost" id="close-btn">Schließen</button>
      </div>
    </div>
  </div>

<script src="firebase-config.js"></script>
<script src="game-data.js"></script>
<script src="sync.js"></script>
<script src="board.js"></script>
<script>
  const camrow = document.getElementById('camrow');

  function renderCamRow(){
    camrow.innerHTML = '';
    PLAYERS.forEach(p => {
      const tile = document.createElement('div');
      tile.className = 'cam-tile';

      const videoWrap = document.createElement('div');
      videoWrap.className = 'cam-video-wrap';

      const placeholder = document.createElement('div');
      placeholder.className = 'cam-placeholder';
      placeholder.textContent = p.name.charAt(0).toUpperCase();

      const video = document.createElement('video');
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;

      const camBtn = document.createElement('button');
      camBtn.className = 'cam-toggle';
      camBtn.textContent = 'Kamera an';
      camBtn.addEventListener('click', async () => {
        if (video.style.display === 'block') {
          video.srcObject && video.srcObject.getTracks().forEach(t => t.stop());
          video.style.display = 'none';
          placeholder.style.display = 'flex';
          camBtn.textContent = 'Kamera an';
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;
          video.style.display = 'block';
          placeholder.style.display = 'none';
          camBtn.textContent = 'Kamera aus';
        } catch (err) {
          alert('Kamera konnte nicht gestartet werden: ' + err.message);
        }
      });

      videoWrap.appendChild(placeholder);
      videoWrap.appendChild(video);
      videoWrap.appendChild(camBtn);

      const footer = document.createElement('div');
      footer.className = 'cam-footer';
      const nameEl = document.createElement('span');
      nameEl.className = 'cam-name';
      nameEl.textContent = p.name;
      const scoreEl = document.createElement('span');
      scoreEl.className = 'cam-score';
      scoreEl.textContent = p.score;
      footer.appendChild(nameEl);
      footer.appendChild(scoreEl);

      tile.appendChild(videoWrap);
      tile.appendChild(footer);
      camrow.appendChild(tile);
    });
  }

  // Board rein zur Anzeige (nicht klickbar) — nur der Host löst Fragen aus.
  renderBoard(false);
  renderCamRow();

  // Live-Updates aus Firebase übernehmen:
  watchUsedCells(applyUsedCells);
  watchPlayers(players => {
    PLAYERS = players;
    renderCamRow();
  });
</script>
</body>
</html>
