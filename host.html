<!-- JAVASCRIPT MODUL -->
  <script type="module">
    import { 
      watchPlayers, 
      savePlayers, 
      seedPlayersIfEmpty, 
      watchUsedCells, 
      resetUsedCells 
    } from './sync.js';
    import { renderBoard, applyUsedCells } from './board.js';

    let PLAYERS = [];
    let nextId = 1;

    const camrow = document.getElementById('camrow');
    const hostRows = document.getElementById('host-rows');
    const addTeamButton = document.getElementById('add-team');
    const resetBoardButton = document.getElementById('reset-board-btn');

    function normalizePlayers(players) {
      if (!players) return [];
      if (Array.isArray(players)) return players;
      return Object.values(players);
    }

    function updateNextId() {
      if (!PLAYERS || PLAYERS.length === 0) {
        nextId = 1;
        return;
      }
      nextId = Math.max(0, ...PLAYERS.map(player => Number(player.id) || 0)) + 1;
    }

    function renderCamRow() {
      camrow.innerHTML = '';
      PLAYERS.forEach(player => {
        const tile = document.createElement('div');
        tile.className = 'cam-tile';

        const videoWrap = document.createElement('div');
        videoWrap.className = 'cam-video-wrap';

        const placeholder = document.createElement('div');
        placeholder.className = 'cam-placeholder';
        placeholder.textContent = (player.name || '?').charAt(0).toUpperCase();

        const video = document.createElement('video');
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.style.display = 'none';

        const camButton = document.createElement('button');
        camButton.className = 'cam-toggle';
        camButton.textContent = 'Kamera an';

        camButton.addEventListener('click', async () => {
          if (video.style.display === 'block') {
            if (video.srcObject) {
              video.srcObject.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            video.style.display = 'none';
            placeholder.style.display = 'flex';
            camButton.textContent = 'Kamera an';
            return;
          }

          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.style.display = 'block';
            placeholder.style.display = 'none';
            camButton.textContent = 'Kamera aus';
          } catch (error) {
            console.error('Kamera-Fehler:', error);
            alert('Kamera konnte nicht gestartet werden: ' + error.message);
          }
        });

        videoWrap.appendChild(placeholder);
        videoWrap.appendChild(video);
        videoWrap.appendChild(camButton);

        const footer = document.createElement('div');
        footer.className = 'cam-footer';

        const nameElement = document.createElement('span');
        nameElement.className = 'cam-name';
        nameElement.textContent = player.name;

        const scoreElement = document.createElement('span');
        scoreElement.className = 'cam-score';
        scoreElement.textContent = player.score;

        footer.appendChild(nameElement);
        footer.appendChild(scoreElement);

        tile.appendChild(videoWrap);
        tile.appendChild(footer);
        camrow.appendChild(tile);
      });
    }

    function renderHostRows() {
      hostRows.innerHTML = '';
      PLAYERS.forEach(player => {
        const row = document.createElement('div');
        row.className = 'host-row';

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = player.name;
        nameInput.addEventListener('change', event => {
          player.name = event.target.value;
          savePlayers(PLAYERS);
        });

        const minusButton = document.createElement('button');
        minusButton.className = 'score-btn';
        minusButton.textContent = '−';
        minusButton.addEventListener('click', () => {
          player.score = Number(player.score || 0) - 100;
          renderCamRow();
          renderHostRows();
          savePlayers(PLAYERS);
        });

        const scoreElement = document.createElement('span');
        scoreElement.className = 'host-score-value';
        scoreElement.textContent = Number(player.score || 0);

        const plusButton = document.createElement('button');
        plusButton.className = 'score-btn';
        plusButton.textContent = '+';
        plusButton.addEventListener('click', () => {
          player.score = Number(player.score || 0) + 100;
          renderCamRow();
          renderHostRows();
          savePlayers(PLAYERS);
        });

        const removeButton = document.createElement('button');
        removeButton.className = 'remove-btn';
        removeButton.textContent = 'Entfernen';
        removeButton.addEventListener('click', () => {
          PLAYERS = PLAYERS.filter(existingPlayer => existingPlayer.id !== player.id);
          updateNextId();
          renderCamRow();
          renderHostRows();
          savePlayers(PLAYERS);
        });

        row.appendChild(nameInput);
        row.appendChild(minusButton);
        row.appendChild(scoreElement);
        row.appendChild(plusButton);
        row.appendChild(removeButton);

        hostRows.appendChild(row);
      });
    }

    addTeamButton.addEventListener('click', () => {
      const newPlayer = {
        id: nextId,
        name: 'Spieler ' + (PLAYERS.length + 1),
        score: 0
      };
      PLAYERS.push(newPlayer);
      nextId++;
      renderCamRow();
      renderHostRows();
      savePlayers(PLAYERS);
    });

    if (resetBoardButton) {
      resetBoardButton.addEventListener('click', () => {
        if (confirm('Möchtest du wirklich alle benutzten Felder auf dem Spielfeld zurücksetzen?')) {
          resetUsedCells();
        }
      });
    }

    // --- INITIALISIERUNG ---
    // 1. Spielfeld sofort anzeigen
    renderBoard(true);

    // 2. Standardspieler initialisieren
    seedPlayersIfEmpty();

    // 3. Datenbank-Sync
    watchPlayers(players => {
      PLAYERS = normalizePlayers(players);
      updateNextId();
      renderCamRow();
      renderHostRows();
    });

    watchUsedCells(applyUsedCells);
  </script>
